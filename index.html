      <style>#loader{z-index:50;color:#f4f6ff;background:radial-gradient(at 50% 120%,#3a1d5e,#16112e 60%);place-items:center;font-family:Fredoka,Nunito,system-ui,sans-serif;transition:opacity .7s;display:grid;position:fixed;inset:0}#loader.out{opacity:0;pointer-events:none}#loader .box{text-align:center;width:min(420px,82vw)}#loader .cup{width:64px;height:64px;margin:0 auto 18px;animation:1.6s ease-in-out infinite bob}#loader h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}#loader p{color:#c3b3e6;min-height:20px;margin:0 0 18px;font-family:JetBrains Mono,monospace;font-size:15px}#loader .bar{background:#ffffff1f;border-radius:99px;height:10px;overflow:hidden}#loader .fill{background:linear-gradient(90deg,#6ef0a8,#5fd4ff);border-radius:99px;width:8%;height:100%;transition:width .4s}@keyframes bob{50%{transform:translateY(-6px)rotate(-4deg)}}</style>

        <div class="bar"><div class="fill" id="loadfill"></div></div>
      </div>
      <script>
        (function () {
          var f = document.getElementById('loadfill'), p = 8;
          window.__loadTimer = setInterval(function () { if (p < 38) { p += 1.5; f.style.width = p + '%'; } }, 120);
        })();
      </script>
    </div>
    <div class="rotate-hint">Turn your phone sideways — the garage is wide. 💻</div>
